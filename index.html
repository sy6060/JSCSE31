<!DOCTYPE html>
<html>
    <head>
        <title>Change Content</title>
    </head>
    <body>
       <h1>we will change this content which is bulb image here</h1>
       <h1>
        <img src="offbulb.jpg" id="img1" alt="Off Bulb" style="width: 100px; height: 200px;">
        <button type="button" onclick="turnOnBulb()">click here to turn on bulb</button>
        
        <button type="button" onclick="turnOffBulb()">click here to turn off bulb</button>
       
        <img src="onbulb.png" id="img2" alt="On bulb" style="display:none; width: 100px; height: 200px;">
       </h1>
    </body>
</html>
