//registration form
//1. 10 fields(related to student details)
//2.use different input feilds for each detail
//3.submit button

<!DOCTYPE html>
<html>
<body style="background-color: #f4f8f6; font-family: Arial, sans-serif;">
    <div style="width: 50%; margin: auto; background-color: #e7f4fae8; padding: 20px; border-radius: 10px;">
        <h2>Student Registration Form</h2>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address"><br><br>

        <label for="city">City:</label>
        <input type="text" id="city" name="city"><br><br>

        <label for="state">State:</label>
        <input type="text" id="state" name="state"><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="branch">Branch:</label>
        <input type="text" id="branch" name="branch"><br><br>

        <label for="gpa">GPA:</label>
        <input type="number" id="gpa" name="gpa" step="0.01"><br><br>

        <input type="submit" value="Submit">
    </form></div>
</body>
</html>
